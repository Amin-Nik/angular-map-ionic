<ion-list>
    @for (item of carsData(); track item.id) {
    <div class="car-container">
        <ion-button class="car-list" (click)="setMqtt(item.carName,item.carNumber)" fill="outline" expand="block">
            <div>
                <ion-text>{{item.carName}}</ion-text>
                <ion-text>{{item.carNumber}}</ion-text>
            </div>
        </ion-button>
        <div id="delete-btn" (click)="deleteCar(item.id)">
            <ion-icon name="trash-outline"></ion-icon>
        </div>
    </div>
    }
    <ion-fab vertical="bottom" horizontal="end" slot="fixed">
        <ion-fab-button routerLink="/add">
            <ion-icon name="add"></ion-icon>
        </ion-fab-button>
    </ion-fab>
</ion-list>
